<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic 8-Ball</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #12131a;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .sahne {
            perspective: 600px;
            margin-bottom: 20px;
        }

        .top {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 35% 30%, #555 0%, #1a1a1a 40%, #000 85%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 25px 35px rgba(0,0,0,0.7), inset -8px -8px 20px rgba(0,0,0,0.9);
            cursor: pointer;
            transition: transform 0.08s ease-out;
        }

        .parlama {
            position: absolute;
            top: 0;
            left: 0;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35) 0%, transparent 40%);
            pointer-events: none;
        }

        .golge {
            width: 160px;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
            margin: 5px auto 0 auto;
            border-radius: 50%;
        }

        .sekiz-daire {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 40% 35%, #fff 0%, #ddd 80%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            font-weight: bold;
            color: black;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            user-select: none;
        }

        .cevap {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #1a2a4a 0%, #080c14 90%);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: #4da6ff;
            box-shadow: inset 0 0 10px #0055ff;
            user-select: none;
        }

        #soru {
            padding: 10px;
            width: 280px;
            margin-top: 15px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 15px;
            outline: none;
        }

        #sor-btn {
            padding: 10px 25px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        #sor-btn:hover {
            background-color: #2563eb;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            font-size: 13px;
            color: #777;
        }

        @keyframes titreme {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 8px) rotate(-8deg); }
            40% { transform: translate(10px, -8px) rotate(8deg); }
            60% { transform: translate(-8px, -5px) rotate(-5deg); }
            80% { transform: translate(8px, 5px) rotate(5deg); }
            100% { transform: translate(0, 0); }
        }

        .sallaniyor {
            animation: titreme 0.5s ease-in-out !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Magic 8-Ball</h2>

        <div class="sahne">
            <div class="top" id="top">
                <div class="parlama"></div>
                <div class="sekiz-daire" id="sekiz">8</div>
                <div class="cevap" id="cevap"></div>
            </div>
            <div class="golge"></div>
        </div>

        <input type="text" id="soru" placeholder="Bir soru sorun...">
        <button id="sor-btn">Sor</button>
    </div>

    <div class="footer">
        Yusuf Kaan Saçlı tarafından yapıldı (Edited by Kayra)
    </div>

    <script>
        var cevaplar = [
            "Kesin bilgi, yayalım",
            "Rüyanda görürsün",
            "Bana soracağına git uyu",
            "Yüzde yüz evet",
            "Küreye format attım az önce, tekrar dene",
            "Şüphen olmasın kanka",
            "İmkansız, hiç heveslenme",
            "Yapay zeka bile buna hayır dedi",
            "Medyum Memiş onayladı",
            "Bir bardak soğuk su iç bence",
            "Bunu bilsem iddaa oynardım",
            "Büyük ihtimalle evet",
            "Gezegenler ters dönüyor, bugün olmaz",
            "Sen önce kendine dürüst ol",
            "Kesinlikle hayır",
            "Şansını zorlama",
            "Evren bu soruya error 404 verdi",
            "Falında dram çıktı, maalesef",
            "Şu an kahve içiyorum, sonra sor",
            "Cevap verirdim ama moralin bozulur",
            "Git bir yüzünü yıka gel",
            "Tabii ki evet, ne sandın?",
            "Zaman gösterecek",
            "Bence sen de cevabı biliyorsun",
            "Gözünü kapat ve evet de",
            "Hiç sanmıyorum",
            "Kaderin yeşil ışık yaktı",
            "Bu soruya cevap vermem için beni 2 kere salla",
            "Soru güzel ama muhatap yanlış",
            "Yüzde bir milyon evet"
        ];

        var topDiv = document.getElementById("top");
        var sekizDiv = document.getElementById("sekiz");
        var cevapDiv = document.getElementById("cevap");
        var soruInput = document.getElementById("soru");
        var btn = document.getElementById("sor-btn");

        var calisiyor = false;

        window.onmousemove = function(e) {
            if (calisiyor) return;
            var x = (e.clientX - window.innerWidth / 2) * 0.05;
            var y = (e.clientY - window.innerHeight / 2) * 0.05;
            topDiv.style.transform = "perspective(600px) rotateY(" + x + "deg) rotateX(" + (-y) + "deg)";
        };

        function cevapVer() {
            var soru = soruInput.value.trim();
            if (soru == "") {
                alert("Lütfen bir soru sorun!");
                return;
            }

            calisiyor = true;
            topDiv.classList.add("sallaniyor");
            sekizDiv.style.display = "none";
            cevapDiv.style.display = "none";

            setTimeout(function() {
                topDiv.classList.remove("sallaniyor");
                var index = Math.floor(Math.random() * cevaplar.length);
                cevapDiv.innerText = cevaplar[index];
                cevapDiv.style.display = "flex";
                calisiyor = false;
            }, 500);
        }

        btn.onclick = cevapVer;
        topDiv.onclick = cevapVer;

        soruInput.onkeydown = function(e) {
            if (e.key === "Enter") {
                cevapVer();
            }
        };
    </script>
</body>
</html>
